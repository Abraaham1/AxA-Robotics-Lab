      <nav aria-label="Primary">
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Home</a></li>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Projects</h1>
        <p>Working builds across robotics control and generative systems. Select a project to see demo footage and technical notes.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="project-grid">

          <button
            class="project-card"
            data-title="Humanoid Walking Robot"
            data-status="completed"
            data-status-label="Completed"
            data-description="A 15-degree-of-freedom simulated humanoid, trained with reinforcement learning over 200 million steps using a multilayer perceptron policy network. The clip shows two evaluation scenarios: recovering balance under push and pull disturbances, and walking laterally without losing footing."
            data-tags="Reinforcement Learning, PyBullet, MLP Policy, Simulation"
            data-media="video:images/projects/humanoid-demo.mp4,image:images/projects/humanoid-1.jpg,image:images/projects/humanoid-2.jpg"
          >
            <div class="project-card-media">
              <video src="images/projects/humanoid-demo.mp4" muted loop playsinline aria-hidden="true"></video>
            </div>
            <span class="status status--completed">Completed</span>
            <h3>Humanoid Walking Robot</h3>
            <p>15-DOF humanoid trained with RL over 200M simulated steps.</p>
            <span class="card-cta">View demo and details</span>
          </button>

          <button
            class="project-card"
            data-title="CV-Controlled Robotic Hand"
            data-status="completed"
            data-status-label="Completed"
            data-description="A physical robotic hand controlled remotely through a computer-vision hand-tracking pipeline. Finger movements are captured from a live camera feed and mapped in real time to servo motors driving the mechanical hand, allowing control from anywhere with a camera and network connection."
            data-tags="Computer Vision, OpenCV, MediaPipe, Servo Control"
            data-media="video:images/projects/hand-demo.mp4,image:images/projects/hand-1.jpg,image:images/projects/hand-2.jpg"
          >
            <div class="project-card-media">
              <video src="images/projects/hand-demo.mp4" muted loop playsinline aria-hidden="true"></video>
            </div>
            <span class="status status--completed">Completed</span>
            <h3>CV-Controlled Robotic Hand</h3>
            <p>A mechanical hand operable remotely via real-time hand tracking.</p>
            <span class="card-cta">View demo and details</span>
          </button>

          <button
            class="project-card"
            data-title="Neural Morphogenesis"
            data-status="ongoing"
            data-status-label="Ongoing"
            data-description="A Neural Cellular Automata system that grows a target structure from a single seed cell, guided by a genome-like set of local update rules rather than a global blueprint. The current implementation works in 2D, shown here growing toward a target image. 3D and 4D (structure over time) extensions are in progress."
            data-tags="Neural Cellular Automata, Self-Organization, PyTorch"
            data-media="video:images/projects/morphogenesis-demo.mp4,image:images/projects/morph-1.jpg,image:images/projects/morph-2.jpg"
          >
            <div class="project-card-media">
              <video src="images/projects/morphogenesis-demo.mp4" muted loop playsinline aria-hidden="true"></video>
            </div>
            <span class="status status--ongoing">Ongoing</span>
            <h3>Neural Morphogenesis</h3>
            <p>Growing target structures from a single cell using local rules, in 2D for now.</p>
            <span class="card-cta">View demo and details</span>
          </button>

        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" aria-label="Close project details">&times;</button>

      <div class="modal-media-col">
        <div class="carousel">
          <div class="carousel-track"></div>
          <div class="carousel-controls">
            <button type="button" class="carousel-btn" data-carousel-prev aria-label="Previous slide">&larr;</button>
            <div class="carousel-dots"></div>
            <button type="button" class="carousel-btn" data-carousel-next aria-label="Next slide">&rarr;</button>
          </div>
        </div>
      </div>

      <div class="modal-body-col">
        <span class="status" data-modal-status></span>
        <h3 id="modal-title" data-modal-title></h3>
        <p data-modal-description></p>
        <div class="modal-tags" data-modal-tags></div>
      </div>
    </div>
  </div>
